<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e7c1"/>
      <stop offset="40%" stop-color="#e9cf9a"/>
      <stop offset="100%" stop-color="#d3a94f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="800" height="1200" fill="url(#base)"/>
  <!-- soft marble clouds -->
  <ellipse cx="200" cy="300" rx="280" ry="180" fill="#f6e7c1" opacity="0.55" filter="url(#soft2)"/>
  <ellipse cx="600" cy="700" rx="300" ry="220" fill="#b9862f" opacity="0.25" filter="url(#soft2)"/>
  <ellipse cx="350" cy="950" rx="260" ry="160" fill="#f6e7c1" opacity="0.4" filter="url(#soft2)"/>
  <ellipse cx="650" cy="200" rx="200" ry="140" fill="#b9862f" opacity="0.2" filter="url(#soft2)"/>
  <!-- gold veins -->
  <path d="M0 180 Q200 260 340 200 T800 280" stroke="#7a4c14" stroke-width="3" fill="none" opacity="0.35" filter="url(#soft)"/>
  <path d="M0 200 Q200 280 340 220 T800 300" stroke="#d3a94f" stroke-width="1.4" fill="none" opacity="0.8"/>
  <path d="M100 0 Q180 300 120 600 T200 1200" stroke="#7a4c14" stroke-width="2.5" fill="none" opacity="0.28" filter="url(#soft)"/>
  <path d="M110 0 Q190 300 130 600 T210 1200" stroke="#d3a94f" stroke-width="1.1" fill="none" opacity="0.7"/>
  <path d="M0 620 Q260 560 420 660 T800 600" stroke="#7a4c14" stroke-width="2.2" fill="none" opacity="0.3" filter="url(#soft)"/>
  <path d="M0 635 Q260 575 420 675 T800 615" stroke="#d3a94f" stroke-width="1" fill="none" opacity="0.65"/>
  <path d="M480 0 Q560 400 460 750 T560 1200" stroke="#7a4c14" stroke-width="2" fill="none" opacity="0.25" filter="url(#soft)"/>
  <path d="M490 0 Q570 400 470 750 T570 1200" stroke="#d3a94f" stroke-width="0.9" fill="none" opacity="0.6"/>
  <path d="M0 940 Q300 880 500 980 T800 920" stroke="#7a4c14" stroke-width="2.4" fill="none" opacity="0.3" filter="url(#soft)"/>
  <path d="M0 955 Q300 895 500 995 T800 935" stroke="#d3a94f" stroke-width="1.1" fill="none" opacity="0.7"/>
  <!-- subtle sparkles -->
  <circle cx="150" cy="450" r="2" fill="#fff8e7" opacity="0.7"/>
  <circle cx="520" cy="380" r="1.5" fill="#fff8e7" opacity="0.6"/>
  <circle cx="680" cy="850" r="2" fill="#fff8e7" opacity="0.5"/>
  <circle cx="300" cy="780" r="1.5" fill="#fff8e7" opacity="0.6"/>
  <circle cx="430" cy="150" r="1.8" fill="#fff8e7" opacity="0.5"/>
  <rect width="800" height="1200" filter="url(#grain)" opacity="0.5"/>
</svg>
